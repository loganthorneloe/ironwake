name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the latest checks for each branch or PR need to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  checks:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Record build identity
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const info = JSON.parse(fs.readFileSync("dist/build-info.json", "utf8")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### IRONWAKE build\n\n${info.label}\n\nSource: ${info.revision}\n`);'
      - name: Upload build identity
        uses: actions/upload-artifact@v7
        with:
          name: build-info-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/build-info.json
          if-no-files-found: error
